name: Linux Debian Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publier dans une GitHub Release
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Tag de la release (ex: v0.2.31, vide = version de tauri.conf.json)'
        required: false
        default: ''
        type: string
  # Version tags are built only once the security scans have passed:
  # Bump & Release dispatches this workflow on its new tag, and the release
  # workflow (tag pushed by hand) calls it.
  workflow_call:
    inputs:
      publish_release:
        required: false
        default: false
        type: boolean
      release_tag:
        required: false
        default: ''
        type: string

# Read-only by default: each job asks for the write access it needs.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-deb:
    runs-on: ubuntu-latest
    # id-token and attestations: signed SLSA build provenance for the release.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Ubuntu system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            cups-client \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            RAW="${{ inputs.release_tag }}"
            VERSION="${RAW#v}"
            TAG="v${VERSION}"
          else
            VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *"-alpha"* ]] || [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-rc"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved version=${VERSION} tag=${TAG}"

      - name: Sync version in tauri.conf.json
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(path, "utf8"));
            conf.version = process.env.BUILD_VERSION;
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + "\n");
          '
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests and lint checks
        run: |
          npx tsc --noEmit
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build Debian package (.deb)
        run: npx tauri build --bundles deb

      - name: Stage Debian artifacts
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist-artifacts
          cp "src-tauri/target/release/bundle/deb/EzReader_${VERSION}_amd64.deb" \
             "dist-artifacts/ezreader_${VERSION}_amd64.deb"
          cp "src-tauri/target/release/ezreader-portable" \
             "dist-artifacts/ezreader-portable-${VERSION}-linux-x64"
          ls -lh dist-artifacts/

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ezreader-linux-deb-${{ steps.version.outputs.version }}
          path: |
            dist-artifacts/ezreader_${{ steps.version.outputs.version }}_amd64.deb
            dist-artifacts/ezreader-portable-${{ steps.version.outputs.version }}-linux-x64
          if-no-files-found: error

      # SLSA build provenance, signed with Sigstore and recorded in the
      # repository's attestations. Check a download with:
      #   gh attestation verify <file> --repo alxbdn/EzReader
      - name: Attest build provenance
        id: attest
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-artifacts/ezreader_${{ steps.version.outputs.version }}_amd64.deb
            dist-artifacts/ezreader-portable-${{ steps.version.outputs.version }}-linux-x64

      - name: Stage provenance
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        shell: bash
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" \
             "dist-artifacts/ezreader-${{ steps.version.outputs.version }}-linux.intoto.jsonl"

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          files: |
            dist-artifacts/ezreader_${{ steps.version.outputs.version }}_amd64.deb
            dist-artifacts/ezreader-portable-${{ steps.version.outputs.version }}-linux-x64
            dist-artifacts/ezreader-${{ steps.version.outputs.version }}-linux.intoto.jsonl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
