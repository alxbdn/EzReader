name: Performance (tabs)

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: 'quick (4 tabs) or soak (8 tabs)'
        type: choice
        options: [soak, quick]
        default: soak

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  tabs:
    name: Tabs test (${{ inputs.profile || (startsWith(github.ref, 'refs/tags/') && 'soak' || 'quick') }})
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build the front end
        run: npm run build

      - name: Tabs test
        env:
          PROFILE: ${{ inputs.profile || (startsWith(github.ref, 'refs/tags/') && 'soak' || 'quick') }}
        run: node tests/perf/tabs.mjs --profile "$PROFILE" --dir "$RUNNER_TEMP/tabs" --out perf-tabs-results.json

      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-tabs-results
          path: perf-tabs-results.json
          if-no-files-found: ignore
