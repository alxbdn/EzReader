name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    # id-token and attestations: signed SLSA build provenance for the packages.
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.prerelease.outputs.is_prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Update version in tauri.conf.json
        shell: pwsh
        run: |
          (Get-Content src-tauri/tauri.conf.json) `
            -replace '"version": "[^"]*"', '"version": "${{ steps.version.outputs.version }}"' |
            Set-Content src-tauri/tauri.conf.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        shell: bash
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri app
        run: npm run tauri build

      - name: Build MSIX package
        shell: pwsh
        run: |
          .\build-msix.ps1 -SkipBuild -Version "${{ steps.version.outputs.version }}"

      - name: Stage artifacts
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp "src-tauri/target/release/ezreader-portable.exe" \
             "ezreader-portable-${VERSION}-win-x64.exe"
          cp "src-tauri/target/release/bundle/nsis/EzReader_${VERSION}_x64-setup.exe" \
             "ezreader-${VERSION}-win-x64-setup.exe"
          cp "msix-output/EzReader_${VERSION}.0_x64.msix" \
             "ezreader-${VERSION}-win-x64.msix"

      # SLSA build provenance, signed with Sigstore and recorded in the
      # repository's attestations. Check a download with:
      #   gh attestation verify <file> --repo alxbdn/EzReader
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ezreader-portable-${{ steps.version.outputs.version }}-win-x64.exe
            ezreader-${{ steps.version.outputs.version }}-win-x64-setup.exe
            ezreader-${{ steps.version.outputs.version }}-win-x64.msix

      - name: Stage provenance
        shell: bash
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" \
             "ezreader-${{ steps.version.outputs.version }}-windows.intoto.jsonl"

      - name: Upload provenance
        uses: actions/upload-artifact@v7
        with:
          name: release-provenance
          path: ezreader-${{ steps.version.outputs.version }}-windows.intoto.jsonl
          if-no-files-found: error

      - name: Check pre-release
        id: prerelease
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" == *"-alpha"* ]] || [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-rc"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: |
            ezreader-portable-${{ steps.version.outputs.version }}-win-x64.exe
            ezreader-${{ steps.version.outputs.version }}-win-x64-setup.exe
            ezreader-${{ steps.version.outputs.version }}-win-x64.msix
          if-no-files-found: error

  # Install, upgrade from the previous release and uninstall on a clean
  # runner: nothing is published if the packages do not install.
  install-test:
    needs: build
    uses: ./.github/workflows/install-test.yml
    with:
      artifact: release-packages
      version: ${{ needs.build.outputs.version }}

  publish:
    needs: [build, install-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-packages

      - uses: actions/download-artifact@v8
        with:
          name: release-provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.is_prerelease == 'true' }}
          files: |
            ezreader-portable-${{ needs.build.outputs.version }}-win-x64.exe
            ezreader-${{ needs.build.outputs.version }}-win-x64-setup.exe
            ezreader-${{ needs.build.outputs.version }}-win-x64.msix
            ezreader-${{ needs.build.outputs.version }}-windows.intoto.jsonl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Security and performance reports, plus the SBOMs, attached to the release.
  reports:
    needs: publish
    permissions:
      contents: write
      security-events: read
      actions: read
    uses: ./.github/workflows/release-reports.yml
    with:
      tag: ${{ github.ref_name }}
