name: App tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: Régénérer les captures de référence (artefact visual-baselines)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: app-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  e2e:
    name: End-to-end (real app)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          driver=webkitgtk-webdriver
          apt-cache show "$driver" >/dev/null 2>&1 || driver=webkit2gtk-driver
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            "$driver" xvfb

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            src-tauri
            src-tauri/shell-ext
          key: e2e

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked --version 2.1.0

      - run: npm ci

      - name: Build the app (debug)
        run: npx tauri build --debug --no-bundle

      - name: Run the end-to-end tests
        run: xvfb-run -a --server-args="-screen 0 1400x1000x24" npm run test:e2e

      - name: Upload screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failures
          path: tests/e2e/results/
          if-no-files-found: ignore

  e2e-windows:
    name: End-to-end (real app, Windows)
    runs-on: windows-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            src-tauri
            src-tauri/shell-ext
          key: e2e-windows

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked --version 2.1.0

      - name: Install the Edge driver that matches WebView2
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty -Path $key).pv
          Write-Host "WebView2 runtime $version"
          $dir = Join-Path $env:RUNNER_TEMP 'edgedriver'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $dir 'edgedriver.zip'
          Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - run: npm ci

      - name: Build the app (debug)
        run: npx tauri build --debug --no-bundle

      - name: Check that the app opens a debugging port
        shell: pwsh
        continue-on-error: true
        run: |
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9333'
          $app = Start-Process -FilePath 'src-tauri\target\debug\ezreader-portable.exe' -PassThru -RedirectStandardOutput app-out.txt -RedirectStandardError app-err.txt
          Start-Sleep -Seconds 20
          Write-Host "app running: $(-not $app.HasExited)"
          Get-CimInstance Win32_Process -Filter "Name = 'msedgewebview2.exe'" | Select-Object -First 3 -ExpandProperty CommandLine
          try { (Invoke-WebRequest -Uri 'http://127.0.0.1:9333/json/version' -UseBasicParsing).Content } catch { Write-Host "no debugging port: $_" }
          Get-Content app-out.txt, app-err.txt -ErrorAction SilentlyContinue | Select-Object -Last 40
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue

      - name: Run the end-to-end tests
        run: npm run test:e2e

      - name: Upload screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failures-windows
          path: tests/e2e/results/
          if-no-files-found: ignore

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build the frontend
        run: npm run build

      - name: Compare screenshots
        if: ${{ !inputs.update_baselines }}
        run: npx playwright test -c tests/visual/playwright.config.ts
        env:
          HOME: /root

      - name: Regenerate the baselines
        if: ${{ inputs.update_baselines }}
        run: npx playwright test -c tests/visual/playwright.config.ts --update-snapshots
        env:
          HOME: /root

      - name: Upload the new baselines
        if: ${{ inputs.update_baselines }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: tests/visual/__screenshots__/

      - name: Upload the differences
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff
          path: |
            tests/visual/report/
            tests/visual/results/
          if-no-files-found: ignore

  corpus:
    name: PDF compatibility corpus
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev qpdf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            src-tauri
            src-tauri/shell-ext
          key: corpus

      - run: npm ci

      - name: Open, annotate and save every corpus file
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib corpus_tests
        env:
          EZREADER_CORPUS_OUT: ${{ runner.temp }}/corpus-out

      - name: Check the saved files with qpdf and pdf.js
        run: node scripts/corpus-check.mjs "${{ runner.temp }}/corpus-out"

      - name: Upload the saved files
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-saved-files
          path: ${{ runner.temp }}/corpus-out/files/
          if-no-files-found: ignore
