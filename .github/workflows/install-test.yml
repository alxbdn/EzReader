name: Install test

on:
  workflow_call:
    inputs:
      artifact:
        description: Name of the artifact holding the setup .exe and the .msix
        required: true
        type: string
      version:
        description: Version of those packages
        required: true
        type: string
  pull_request:
    paths:
      - scripts/build-msix.ps1
      - scripts/install-test.ps1
      - src-tauri/AppxManifest.xml
      - src-tauri/tauri.conf.json
      - src-tauri/tauri.windows.conf.json
      - src-tauri/windows/**
      - src-tauri/shell-ext/**
      - .github/workflows/install-test.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build the packages
    if: ${{ !inputs.artifact }}
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            src-tauri
            src-tauri/shell-ext
          key: install-test

      - name: Test version
        id: version
        shell: bash
        run: echo "version=99.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Set the version
        shell: pwsh
        run: |
          (Get-Content src-tauri/tauri.conf.json) `
            -replace '"version": "[^"]*"', '"version": "${{ steps.version.outputs.version }}"' |
            Set-Content src-tauri/tauri.conf.json

      - run: npm ci

      - name: Build the installer
        run: npx tauri build --bundles nsis

      - name: Build the MSIX
        shell: pwsh
        run: .\scripts\build-msix.ps1 -SkipBuild -Version "${{ steps.version.outputs.version }}"

      - name: Stage packages
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p packages
          cp "src-tauri/target/release/bundle/nsis/EzReader_${VERSION}_x64-setup.exe" "packages/ezreader-${VERSION}-win-x64-setup.exe"
          cp "store/EzReader_${VERSION}.0_x64.msix" "packages/ezreader-${VERSION}-win-x64.msix"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-test-packages
          path: packages/
          if-no-files-found: error

  install:
    name: Install, upgrade, uninstall
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact || 'install-test-packages' }}
          path: packages

      - name: Install test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || needs.build.outputs.version }}
        run: |
          $setup = Get-ChildItem packages -Filter "*-setup.exe" | Select-Object -First 1 -ExpandProperty FullName
          $msix = Get-ChildItem packages -Filter "*.msix" | Select-Object -First 1 -ExpandProperty FullName
          ./scripts/install-test.ps1 -Setup $setup -Msix $msix -Version $env:VERSION
