name: Publish to Microsoft Store

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.4)'
        required: true

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Store ID of EzReader in Partner Center (public, not a secret).
  STORE_APP_ID: ${{ vars.MICROSOFT_STORE_APP_ID || '9P9PVN4DRVS8' }}

jobs:
  publish:
    runs-on: windows-latest

    steps:
      # Needs, in Settings > Secrets and variables > Actions: the variable
      # MICROSOFT_STORE_SELLER_ID and the secrets MICROSOFT_STORE_TENANT_ID,
      # MICROSOFT_STORE_CLIENT_ID and MICROSOFT_STORE_CLIENT_SECRET (a
      # Microsoft Entra app added in Partner Center with the Manager role).
      - name: Check Store credentials
        id: creds
        shell: bash
        env:
          SELLER_ID: ${{ vars.MICROSOFT_STORE_SELLER_ID }}
          TENANT_ID: ${{ secrets.MICROSOFT_STORE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.MICROSOFT_STORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.MICROSOFT_STORE_CLIENT_SECRET }}
        run: |
          missing=()
          [ -n "$SELLER_ID" ] || missing+=("variable MICROSOFT_STORE_SELLER_ID")
          [ -n "$TENANT_ID" ] || missing+=("secret MICROSOFT_STORE_TENANT_ID")
          [ -n "$CLIENT_ID" ] || missing+=("secret MICROSOFT_STORE_CLIENT_ID")
          [ -n "$CLIENT_SECRET" ] || missing+=("secret MICROSOFT_STORE_CLIENT_SECRET")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning title=Microsoft Store submission skipped::Missing: $(printf '%s; ' "${missing[@]}")"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine version
        if: steps.creds.outputs.ready == 'true'
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # The .msix is not on the GitHub release: it is the store-msix-<version>
      # artifact of the run that built the release (Release or Bump & Release).
      - name: Download MSIX from the release build
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NAME="store-msix-${VERSION}"
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=${NAME}" \
            --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::error title=No Store package::No artifact named ${NAME} (artifacts are kept 90 days)."
            exit 1
          fi
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name "$NAME" --dir .

      - name: Install Microsoft Store Developer CLI
        if: steps.creds.outputs.ready == 'true'
        shell: pwsh
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/microsoft/msstore-cli/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match "win-x64\.zip$" } | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile msstore.zip
          Expand-Archive msstore.zip -DestinationPath "$env:LOCALAPPDATA\msstore-cli"
          echo "$env:LOCALAPPDATA\msstore-cli" >> $env:GITHUB_PATH

      - name: Configure and submit to Microsoft Store
        if: steps.creds.outputs.ready == 'true'
        shell: pwsh
        env:
          MICROSOFT_STORE_TENANT_ID: ${{ secrets.MICROSOFT_STORE_TENANT_ID }}
          MICROSOFT_STORE_CLIENT_ID: ${{ secrets.MICROSOFT_STORE_CLIENT_ID }}
          MICROSOFT_STORE_CLIENT_SECRET: ${{ secrets.MICROSOFT_STORE_CLIENT_SECRET }}
        run: |
          # Write config.json (no ClientSecret - it goes to Credential Manager)
          $configDir = "$env:LOCALAPPDATA\Microsoft\MSStore.CLI"
          New-Item -ItemType Directory -Path $configDir -Force | Out-Null
          $config = @{
            TenantId = $env:MICROSOFT_STORE_TENANT_ID
            SellerId = ${{ vars.MICROSOFT_STORE_SELLER_ID }}
            ClientId = $env:MICROSOFT_STORE_CLIENT_ID
          } | ConvertTo-Json
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $configPath = Join-Path $configDir "settings.json"
          [System.IO.File]::WriteAllText($configPath, $config, $utf8NoBom)

          # Store ClientSecret in Windows Credential Manager
          # msstore CLI uses target name "MicrosoftStoreCli:user={clientId}"
          $clientId = $env:MICROSOFT_STORE_CLIENT_ID
          $secret = $env:MICROSOFT_STORE_CLIENT_SECRET
          $target = "MicrosoftStoreCli:user=$clientId"
          cmdkey /generic:$target /user:$clientId /pass:$secret

          # Submit
          $version = "${{ steps.version.outputs.version }}"
          $msixFile = "ezreader-${version}-win-x64.msix"
          Write-Host "Submitting $msixFile to Microsoft Store..."
          msstore publish $msixFile --appId $env:STORE_APP_ID
