name: Trailer capture

on:
  push:
    branches: [trailer-capture]
    paths: ["trailer/**", ".github/workflows/trailer-capture.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo ${{ github.repository }} --pattern "*-setup.exe" --dir "$env:RUNNER_TEMP\rel"
      - name: Get ffmpeg
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress | Out-Null }
          ffmpeg -hide_banner -version | Select-Object -First 1
      - name: Capture the Explorer scenes
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + $env:Path
          $env:EZ_INPROC = "1"
          ./trailer/capture.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trailer-capture
          path: ${{ runner.temp }}/trailer
