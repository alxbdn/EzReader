<!doctype html>
<html><head><meta charset="utf-8"><title>EzReader Store screenshots</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body {
  font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif;
  color: #fafafa;
  background:
    radial-gradient(1200px 900px at 100% 110%, rgba(229, 57, 53, .55), transparent 60%),
    radial-gradient(900px 700px at -10% -20%, rgba(229, 57, 53, .22), transparent 60%),
    linear-gradient(135deg, #1a0a0b 0%, #0b0b0d 55%, #140809 100%);
  position: relative;
}
body.alt {
  background:
    radial-gradient(1100px 800px at 0% 110%, rgba(229, 57, 53, .55), transparent 60%),
    radial-gradient(900px 700px at 110% -20%, rgba(229, 57, 53, .2), transparent 60%),
    linear-gradient(225deg, #1a0a0b 0%, #0b0b0d 55%, #140809 100%);
}
body.red { background: radial-gradient(1400px 1000px at 80% 120%, #ff5a4f 0%, transparent 60%), linear-gradient(135deg, #c62828, #8e1414 60%, #5a0b0b); }
/* faint dot grid, like the app's viewer */
body::before { content: ""; position: absolute; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,.06) 1.2px, transparent 1.4px);
  background-size: 28px 28px; mask-image: linear-gradient(90deg, #000 0%, transparent 70%); }
body.alt::before { mask-image: linear-gradient(270deg, #000 0%, transparent 70%); }

.copy { position: absolute; left: 120px; top: 0; bottom: 0; width: 640px;
  display: flex; flex-direction: column; justify-content: center; }
body.alt .copy { left: auto; right: 120px; }
.kicker { display: inline-flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; color: #ff6b63; margin-bottom: 28px; }
body.red .kicker { color: #ffd2cf; }
.kicker::before { content: ""; width: 34px; height: 3px; background: currentColor; border-radius: 2px; }
h1 { font-size: 86px; line-height: 1.02; font-weight: 700; letter-spacing: -.035em; margin-bottom: 30px; text-wrap: balance; }
p { text-wrap: pretty; }
h1 em { font-style: normal; color: #ff4d44; }
body.red h1 em { color: #1a0a0b; }
p { font-size: 30px; line-height: 1.45; color: #b4b4bd; max-width: 600px; }
body.red p { color: #ffe1de; }
.brand { position: absolute; left: 120px; bottom: 70px; display: flex; align-items: center; gap: 14px;
  font-size: 26px; font-weight: 600; color: #e4e4e7; letter-spacing: -.01em; }
body.alt .brand { left: auto; right: 120px; }
.brand img { width: 40px; height: 40px; }

.shot { position: absolute; right: -40px; top: 50%; transform: translateY(-50%);
  width: 1120px; border-radius: 14px; overflow: hidden;
  box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 40px 120px rgba(0,0,0,.65), 0 10px 30px rgba(0,0,0,.4); }
body.alt .shot { right: auto; left: -40px; }
.shot img { display: block; width: 100%; }

/* big stat (size, speed) */
.stat { position: absolute; z-index: 2; background: #fafafa; color: #09090b; border-radius: 22px; padding: 26px 36px;
  box-shadow: 0 30px 80px rgba(0,0,0,.55); font-weight: 700; letter-spacing: -.03em; }
.stat b { display: block; font-size: 92px; line-height: 1; }
.stat b small { font-size: 46px; color: #E53935; }
.stat span { display: block; font-size: 22px; font-weight: 500; color: #71717a; letter-spacing: 0; margin-top: 6px; }

.chips { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 40px; }
.chip { font-size: 24px; font-weight: 600; padding: 12px 22px; border-radius: 999px;
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); color: #f4f4f5; }
.chip.no { text-decoration: line-through; text-decoration-color: #ff4d44; text-decoration-thickness: 3px; }
/* summary slide: no app window, centred copy and a wall of features */
body.summary .shot { display: none; }
body.summary .copy { left: 0; right: 0; width: auto; align-items: center; text-align: center; padding: 0 200px; }
body.summary h1 { font-size: 112px; }
body.summary p { max-width: 1000px; }
body.summary .chips { justify-content: center; max-width: 1300px; margin-top: 56px; }
body.summary .chip { font-size: 26px; padding: 14px 26px; }
body.summary .brand { left: 50%; transform: translateX(-50%); }
body.red .chip { background: rgba(0,0,0,.18); border-color: rgba(255,255,255,.22); }
body.red .chip.no { text-decoration-color: #1a0a0b; }
</style></head>
<body>
<div class="copy">
  <div class="kicker" id="k"></div>
  <h1 id="h"></h1>
  <p id="p"></p>
  <div class="chips" id="c"></div>
</div>
<div class="shot"><img id="img" alt=""></div>
<div class="brand"><img src="../../src-tauri/icons/icon.png" alt="">EzReader</div>
<script src="slides.js"></script>
<script>
const slides = window.SLIDES;
const i = Number(new URLSearchParams(location.search).get("i") || 0);
const s = slides[i];
document.body.className = s.theme || "";
if (!s.shot) document.body.classList.add("summary");
k.textContent = s.kicker;
h.innerHTML = s.title;
p.textContent = s.text;
if (s.shot) img.src = "shots/" + s.shot;
(s.chips || []).forEach(t => { const d = document.createElement("span");
  d.className = "chip" + (t.startsWith("~") ? " no" : ""); d.textContent = t.replace(/^~/, ""); c.appendChild(d); });
if (s.stat) { const d = document.createElement("div"); d.className = "stat";
  d.innerHTML = `<b>${s.stat.value}</b><span>${s.stat.label}</span>`;
  Object.assign(d.style, s.stat.pos); document.body.appendChild(d); }
</script>
</body></html>
