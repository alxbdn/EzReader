[package]
name = "ezreader"
version = "1.0.0"
description = "A simple, lightweight PDF reader with annotations and signing"
authors = []
license = "MIT"
edition = "2021"

[[bin]]
name = "ezreader-portable"
path = "src/main.rs"

[lib]
name = "ezreader_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.47"
# Only the formats the app opens: fewer decoders a hostile file can reach.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
base64 = "0.22"
url = "2"
getrandom = "0.4"
# Already built for lopdf / png; used directly to pack .docx / .xlsx (ZIP) files.
flate2 = "1"
crc32fast = "1"
# Checks downloaded updates against the SHA-256 GitHub gives (already built for Tauri).
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
winapi = { version = "0.3", features = ["winspool", "wingdi", "winnt", "shellapi", "processthreadsapi", "handleapi", "minwinbase", "minwindef", "errhandlingapi", "winerror", "winuser", "commctrl", "windef", "basetsd", "libloaderapi"] }
# Text recognition with the OCR engine built into Windows (Windows.Media.Ocr):
# same version Tauri already builds, nothing to bundle.
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_System_WinRT",
] }

# Text recognition on Linux: ONNX Runtime linked statically, running
# the PaddleOCR models RapidOCR uses (built into the binary). The runtime is
# fetched once at build time, checked against its hash; the app itself never
# goes online for it.
[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-17", "download-binaries", "tls-native"] }

# macOS: AppKit calls for the window's proportions, and text recognition
# with the engine built into macOS (Vision): nothing to bundle, and the same
# for Intel and Apple Silicon. The same versions Tauri already builds.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSLocale", "NSRange", "NSString", "NSValue", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes"] }

[features]
# Exposes `ezreader_lib::fuzzing`, the entry points of the fuzz targets in
# `fuzz/`. Never enabled in the app.
fuzzing = []

[dev-dependencies]
proptest = "1"

[profile.release]
# A bug on a malformed PDF must fail that one command, not close every
# window with unsaved work: panics unwind and stay in their thread.
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
