[package]
name = "ezreader"
version = "0.2.31"
description = "A simple, lightweight PDF reader with annotations and signing"
authors = []
edition = "2021"

[[bin]]
name = "ezreader-portable"
path = "src/main.rs"

[lib]
name = "ezreader_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.47"
image = { version = "0.25", features = ["png", "jpeg", "webp", "gif", "bmp"] }
base64 = "0.22"
url = "2"
getrandom = "0.4"
# Already built for lopdf / png; used directly to pack .docx / .xlsx (ZIP) files.
flate2 = "1"
crc32fast = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
winapi = { version = "0.3", features = ["winspool", "wingdi", "winnt", "shellapi", "processthreadsapi", "handleapi", "minwinbase", "minwindef", "errhandlingapi", "winerror", "winuser"] }
# Text recognition with the OCR engine built into Windows (Windows.Media.Ocr):
# same version Tauri already builds, nothing to bundle.
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_System_WinRT",
] }

[profile.release]
# A bug on a malformed PDF must fail that one command, not close every
# window with unsaved work: panics unwind and stay in their thread.
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
