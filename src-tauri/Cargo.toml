[package]
name = "ezreader"
version = "0.2.31"
description = "A simple, lightweight PDF reader with annotations and signing"
authors = []
edition = "2021"

[[bin]]
name = "ezreader-portable"
path = "src/main.rs"

[lib]
name = "ezreader_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.47"
image = { version = "0.25", features = ["png", "jpeg", "webp", "gif", "bmp"] }
base64 = "0.22"
getrandom = "0.4"
# Already built for lopdf / png; used directly to pack .docx / .xlsx (ZIP) files.
flate2 = "1"
crc32fast = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
winapi = { version = "0.3", features = ["winspool", "wingdi", "winnt", "shellapi"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
