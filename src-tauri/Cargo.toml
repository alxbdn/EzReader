[package]
name = "ezreader"
version = "1.0.0"
description = "A simple, lightweight PDF reader with annotations and signing"
authors = []
license = "MIT"
edition = "2021"

[[bin]]
name = "ezreader-portable"
path = "src/main.rs"

[lib]
name = "ezreader_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = { version = "0.47", default-features = false, features = ["rayon"] }
memchr = "2"
subsetter = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
base64 = "0.23"
url = "2"
getrandom = "0.4"
flate2 = "1"
crc32fast = "1"
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
winapi = { version = "0.3", features = ["winspool", "wingdi", "winnt", "shellapi", "processthreadsapi", "handleapi", "minwinbase", "minwindef", "errhandlingapi", "winerror", "winuser", "commctrl", "windef", "basetsd", "libloaderapi"] }
webview2-com = "0.39"
windows-collections = "0.3"
windows = { version = "0.62", features = [
  "ApplicationModel",
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Services_Store",
  "Storage_Streams",
  "Win32_System_Com",
  "Win32_System_Recovery",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
] }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-17", "download-binaries", "tls-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSLocale", "NSRange", "NSString", "NSValue", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes"] }

[features]
fuzzing = []

[dev-dependencies]
proptest = "1"

[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
