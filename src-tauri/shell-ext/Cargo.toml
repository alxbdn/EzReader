[package]
name = "ezreader-shell"
version = "1.0.0"
description = "Explorer add-in for EzReader: PDF page thumbnails and the preview pane"
license = "MIT"
edition = "2021"
publish = false

[workspace]

[lib]
name = "ezreader_shell"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ezreader-quicklook"
path = "src/bin/quicklook.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Data_Pdf",
  "Foundation",
  "Graphics_Imaging",
  "Storage_Streams",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Globalization",
  "Win32_Security",
] }
windows-core = "0.62"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
